name: Publish Vibe Physics AI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scientific calculations
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html about.html reader.html CNAME library.css library.js catalog.js styles.css reader.css app.js lecture-data.js crystal-math.js visuals.js teaching.js teaching-math.js teaching-visuals.js learning.js learning-data.js learning-memory.js README.md .nojekyll _site/
          cp -r assets vendor _site/
          cp study-motion.js _site/
          if [ -d lessons ]; then cp -r lessons _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
