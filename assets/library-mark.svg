<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 5 56 54" role="img" aria-label="Vibe Physics AI">
  <style>
    .orbit-start { stop-color: #3965ae; }
    .orbit-end { stop-color: #168477; }
    .wave { stroke: #075a62; }
    .node { fill: #168477; }
    @media (prefers-color-scheme: dark) {
      .orbit-start { stop-color: #8ca9f4; }
      .orbit-end { stop-color: #67d9bf; }
      .wave { stroke: #bdf6e7; }
      .node { fill: #67d9bf; }
    }
  </style>
  <defs>
    <linearGradient id="orbit" x1="9" y1="42" x2="57" y2="19" gradientUnits="userSpaceOnUse">
      <stop class="orbit-start"/>
      <stop class="orbit-end" offset="1"/>
    </linearGradient>
    <path id="pulse" d="M12 33h6c4.5 0 5.2 10 10 10 6.5 0 7-22 13-22 4.5 0 5 11 11 11"/>
    <mask id="crossing" maskUnits="userSpaceOnUse" x="4" y="5" width="56" height="54">
      <rect x="4" y="5" width="56" height="54" fill="white"/>
      <use href="#pulse" fill="none" stroke="black" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#crossing)">
    <ellipse cx="32" cy="32" rx="24" ry="14.5" transform="rotate(-31 32 32)"
      fill="none" stroke="url(#orbit)" stroke-width="3.5"/>
    <circle class="node" cx="49.7" cy="16.3" r="3"/>
  </g>
  <use class="wave" href="#pulse" fill="none" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
